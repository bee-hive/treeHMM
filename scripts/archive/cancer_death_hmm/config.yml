# ============================================================
# Configuration for the cancer-cell DEATH-state HMM experiments
# ============================================================
# Goal: a multi-state (AR-)HMM in which cancer cells undergoing death
# events concentrate in an identifiable state.  Cancer cells are defined
# by their PHASE masks (channel 1 of the type-separated CVAT tracks),
# because that is the ID space the ground-truth death annotations use.
#
# Pipeline steps (each in its own conda env):
#   1. calculate_cancer_phase_emissions.py  OccidentAnalysis
#   2. compute_dino_embeddings.py           cs229Dino    (self-contained)
#   3. reduce_dino_pca.py                   cs229Dino
#   4. fit_death_hmm.py                     treeHMM_env  (all arms x k x seeds)
#   5. evaluate_death_states.py             OccidentAnalysis (numpy/pandas only)
#
# Step 0 (type-separated track regeneration) is NOT repeated here; the
# tracks in scripts/cancer_dino_hmm/type_sep_tracks are reused as-is.

# ------------------------------------------------------------------
# Crop identifiers
# ------------------------------------------------------------------
crop_ids:
  - B4_t50t100y200y350x750x900
  - B8_t50t100y200y350x750x900
  - E4_t50t100y200y350x750x900
  - B4_t250t300y200y350x750x900
  - B8_t250t300y200y350x750x900
  - E4_t250t300y200y350x750x900

# Experimental conditions mapped to crop IDs (used only for reporting;
# the downstream per-condition death quantification is a separate task).
conditions_dict:
  SH:
    - B4_t50t100y200y350x750x900
    - B4_t250t300y200y350x750x900
  RASA2:
    - E4_t50t100y200y350x750x900
    - E4_t250t300y200y350x750x900
  CUL5:
    - B8_t50t100y200y350x750x900
    - B8_t250t300y200y350x750x900

# ------------------------------------------------------------------
# Emission features
# ------------------------------------------------------------------
# ALL of these are computed and saved by Step 1.  Each arm below selects
# the subset that actually feeds the model; the rest remain available as
# annotation-independent diagnostics for state profiling and evaluation.
emission_feature_names:
  - area                      # phase-mask pixel count
  - circularity               # 4*pi*area / perimeter^2 of the largest component
  - velocity                  # centroid displacement, px/frame
  - t_cell_neighbors_20px     # T cells within radius_px of the phase centroid
  - dilated_t_cell_neighbors  # T cells touching the mask dilated by disk(dilate_radius)
  - d_area_frac               # (area_t - area_prev) / area_prev  (scale-free)
  - d_circularity             # circularity_t - circularity_prev
  - win_std_log_area          # trailing rolling std of log(area)
  - win_std_circularity       # trailing rolling std of circularity
  - win_std_displacement      # trailing rolling std of per-frame displacement

# Feature-computation parameters
radius_px: 20         # centroid-to-centroid T-cell neighbor radius
dilate_radius: 2      # disk radius for the dilated-mask T-cell contact count
window_frames: 5      # trailing window length for the win_std_* features

# ------------------------------------------------------------------
# Experiment arms
# ------------------------------------------------------------------
# Each arm is an independent fit over the SAME cells, differing only in
# which features feed the model and the AR lag order.  `use_dino: true`
# appends the top-`n_dino_pcs` whitened DINOv2 PCs to `features`.
arms:
  # Cheapest possible baseline: change is handed to the model directly as
  # an observable, so a death state needs only a mean shift in delta-space
  # (9 emission parameters at k states) rather than a 4-parameter
  # autoregression it has little data to fit.
  - name: delta_lag0
    features: [d_area_frac, d_circularity]
    num_lags: 0
    use_dino: false

  # Arm 2 as specified: raw shape, autoregression does the change detection.
  - name: shape_lag1
    features: [area, circularity]
    num_lags: 1
    use_dino: false

  # Arm 3 as specified: shape + T-cell context.  T-cell counts do not
  # change at the transition, but should separate T-cell-mediated shape
  # change from incidental shape change.
  - name: shape_tcell_lag1
    features: [area, circularity, dilated_t_cell_neighbors]
    num_lags: 1
    use_dino: false

  # Durability arm: adds the trailing-window instability features, so the
  # death state can persist through the unstable post-death frames instead
  # of firing on a single frame.  More observations for the rare state.
  - name: shape_window_lag1
    features: [area, circularity, win_std_log_area, win_std_circularity,
               win_std_displacement]
    num_lags: 1
    use_dino: false

  # Arm 1 as specified: appearance only, via DINOv2 on 50x50 patches.
  # NOTE the parameter budget -- at 10 PCs with full covariance and AR(1)
  # this is 165 emission parameters per state against roughly 50 death
  # cell-frames.  Expect the death state's covariance to be poorly
  # determined; `dino_lag1_win` below is the better-posed variant.
  - name: dino_lag1
    features: []
    num_lags: 1
    use_dino: true

  # DINO appearance plus the window-instability features, which give the
  # death state enough frames to be estimable.
  - name: dino_window_lag1
    features: [win_std_log_area, win_std_circularity, win_std_displacement]
    num_lags: 1
    use_dino: true

# ------------------------------------------------------------------
# Model fitting
# ------------------------------------------------------------------
num_states_sweep: [2, 3, 4, 5, 6]   # k values fitted per arm
em_seeds: [0, 1, 2]                 # per (arm, k); best final log prob wins
num_em_iters: 100
init_method: kmeans                 # k-means over ACTIVE cell-frames only
init_stickiness: 0.9                # diagonal mass of the initial transition matrix
min_t: 10                           # min active frames to keep a cell
allow_divisions: false              # tree part off, per the experiment design
standardize_features: true          # z-score model features over active cell-frames

# ------------------------------------------------------------------
# DINOv2 image-embedding settings
# ------------------------------------------------------------------
use_dino: true                      # master switch for steps 2-3
dino_model_id: facebook/dinov2-base
dino_model_path: /gladstone/engelhardt/home/jadjasu/.cache/huggingface/hub/models--facebook--dinov2-base
dino_patch_px: 50                   # 50x50 patch centered on the phase centroid
n_dino_pcs: 10
dino_pca_whiten: true               # equalize PC scales before fitting
dino_batch_size: 256

# --- RGB construction for the patches ---
# The phase image is the luminance base and the masks are ALPHA-BLENDED
# on top, so cell texture survives rather than being replaced by flat
# mask colour.  The subject cell gets its own colour, distinct from other
# cancer cells, so the embedding knows which cell it is describing.
# The three RGB hues are spent on cell-type masks, so the RFP nuclei channel
# is OFF by default and, when enabled, is mixed into luminance rather than
# into red (where it would collide with the subject-cell colour).  RFP is
# better used as an independent modality -- nuclear condensation is a death
# cue statistically independent of phase shape -- than as patch decoration.
dino_include_rfp: false
dino_rgb_alpha_nuclei: 0.30         # luminance weight for RFP when enabled
dino_mask_alpha: 0.45               # cancer/T-cell mask overlay strength
dino_subject_colour: [1.0, 0.0, 0.0]   # subject cancer cell  -> red
dino_other_cancer_colour: [0.0, 0.0, 1.0]  # other cancer cells -> blue
dino_tcell_colour: [0.0, 1.0, 0.0]     # T cells             -> green
# Contrast is normalized ONCE per crop over the whole stack using these
# percentiles, not per frame.  Per-frame min-max lets a single bright
# artifact rescale a whole frame and turns the leading PCs into a clock.
dino_norm_percentiles: [1.0, 99.0]

# ------------------------------------------------------------------
# Input data paths
# ------------------------------------------------------------------
# Type-separated CVAT tracks: (T,H,W,2), ch0 = T cells, ch1 = cancer phase.
type_sep_tracks_dir: /gladstone/engelhardt/lab/jadjasu/LiveCellUmbrella/treeHMM/scripts/cancer_dino_hmm/type_sep_tracks

# CVAT annotation root; supplies {well}/{crop}/crop.tiff as the video background.
cvat_base_dir: /gladstone/engelhardt/lab/adamw/MarsonImagingPipeline/data/ground_truth_tracking_annotations/cvat_annotations/TCR-T/

# Pre-cut crops aligned with the ground-truth tracks; last axis: 0 = RFP, 1 = phase.
# path = {tracking_crops_dir}/{well}/{crop_id}/crop.tiff
#
# Do NOT substitute a slice of the per-well registered.tiff taken with the
# crop_id's coordinates -- those land elsewhere.  Against the masks, the
# registered slice puts as much RFP in T-cell masks as in cancer masks
# (2.06 vs 2.64 over background) while this source gives 1.74 vs 3.83, and
# only cancer cells carry RFP.
tracking_crops_dir: /gladstone/engelhardt/lab/MarsonLabIncucyteData/TrackingCrops/CarnevaleRepStim

imaging_pipeline_dir: /gladstone/engelhardt/lab/jadjasu/LiveCellUmbrella/MarsonImagingPipeline
treehmm_dir: /gladstone/engelhardt/lab/jadjasu/LiveCellUmbrella/treeHMM

# Ground-truth death annotations (see death_annotations.yml).
annotations_path: death_annotations.yml

# ------------------------------------------------------------------
# Output
# ------------------------------------------------------------------
# Per-crop feature/embedding artifacts:  {output_base_dir}/{crop}/
# Per-fit results:                       {output_base_dir}/fits/{arm}/k{K}/
output_base_dir: /gladstone/engelhardt/lab/jadjasu/LiveCellUmbrella/treeHMM/analysis/cancer_death_hmm

# ------------------------------------------------------------------
# Overlay videos (create_state_overlay_videos.py)
# ------------------------------------------------------------------
# Which fits to render, as one video per (fit, crop).
#   auto  -> one k per arm, chosen from evaluation.csv by lowest
#            frame_recall_p, ties broken by fewer division false positives
#   all   -> every (arm, k) that was fitted  [6 arms x 5 k x 6 crops = 180 videos]
#   list  -> explicit, e.g.  [{arm: shape_lag1, k: 6}, {arm: delta_lag0, k: 6}]
video_fits: auto
video_fps: 2
video_figsize: [7, 7]

# ============================================================
# Configuration for the cancer-cell DEAD-STATE HMM experiments
# ============================================================
# Successor to cancer_death_hmm.  That pipeline targeted the death EVENT --
# a single-frame transition.  This one targets the dead CONDITION: an
# absorbing state a cell enters and never leaves.
#
# Three changes make that possible:
#   1. MEMORY features, which are monotone within a track.  Without them a
#      post-death frame is indistinguishable from an ordinary small round
#      cell, and no amount of state count will hold a dead state.
#   2. INTENSITY features from both channels.  cancer_death_hmm was pure
#      mask geometry; apoptotic cells in phase contrast go bright and
#      refractile, and RFP nuclei condense and fragment.  Both are
#      persistent, unlike the transient shape jump.
#   3. An ABSORBING state constraint -- the last state's transition row is
#      pinned to self-transition 1.0, so dead -> alive is impossible.
#
# Balancing/downsampling is deliberately NOT done here.  Targeting the dead
# condition instead of the event already moves the class balance from ~0.5%
# to ~23% of cell-frames (measured against the B8_t50 annotations).
#
# Steps:
#   1. calculate_dead_state_features.py  OccidentAnalysis
#   2. fit_dead_state_hmm.py             treeHMM_env
#   3. evaluate_dead_states.py           OccidentAnalysis
#   4. create_state_overlay_videos.py    OccidentAnalysis

crop_ids:
  - B4_t50t100y200y350x750x900
  - B8_t50t100y200y350x750x900
  - E4_t50t100y200y350x750x900
  - B4_t250t300y200y350x750x900
  - B8_t250t300y200y350x750x900
  - E4_t250t300y200y350x750x900

conditions_dict:
  SH:
    - B4_t50t100y200y350x750x900
    - B4_t250t300y200y350x750x900
  RASA2:
    - E4_t50t100y200y350x750x900
    - E4_t250t300y200y350x750x900
  CUL5:
    - B8_t50t100y200y350x750x900
    - B8_t250t300y200y350x750x900

# ------------------------------------------------------------------
# Features (all computed and saved; arms select subsets)
# ------------------------------------------------------------------
emission_feature_names:
  # --- geometry (carried over from cancer_death_hmm) ---
  - area
  - circularity
  - velocity
  - t_cell_neighbors_20px
  - dilated_t_cell_neighbors
  - d_area_frac
  - d_circularity
  - win_std_log_area
  - win_std_circularity
  - win_std_displacement
  # --- memory: monotone within a track, so a state can persist ---
  - area_over_running_max        # area_t / max(area so far); drops at death, never recovers
  - running_max_abs_d_circularity  # non-decreasing; "this cell has already rounded up"
  # --- phase intensity ---
  - phase_mean                   # mean phase inside the mask (refractile = bright)
  - phase_std                    # within-mask SD (granularity / texture)
  - phase_contrast               # mask mean minus surrounding-ring mean
  # --- RFP intensity (only cancer cells carry RFP nuclei) ---
  - rfp_mean                     # mean RFP inside the mask
  - rfp_cv                       # within-mask SD / mean (condensation, fragmentation)
  - rfp_concentration            # share of the mask's total RFP in its brightest 10% of pixels

radius_px: 20            # centroid-to-centroid T-cell neighbour radius
dilate_radius: 2         # disk radius for dilated-mask T-cell contact
window_frames: 5         # trailing window for win_std_* features
ring_radius: 3           # disk radius for the phase_contrast surrounding ring
rfp_top_fraction: 0.10   # brightest-pixel fraction for rfp_concentration
intensity_percentiles: [1.0, 99.0]   # per-crop, whole-stack intensity normalization

# ------------------------------------------------------------------
# Experiment arms
# ------------------------------------------------------------------
# Every arm is fitted twice -- once with the absorbing constraint and once
# without -- so the constraint's effect is measurable rather than assumed.
arms:
  - name: memory
    features: [area_over_running_max, running_max_abs_d_circularity]
    num_lags: 1

  - name: intensity
    features: [phase_mean, phase_std, phase_contrast,
               rfp_mean, rfp_cv, rfp_concentration]
    num_lags: 1

  - name: memory_intensity
    features: [area_over_running_max, running_max_abs_d_circularity,
               phase_mean, phase_std, phase_contrast,
               rfp_mean, rfp_cv, rfp_concentration]
    num_lags: 1

  - name: shape_memory
    features: [area, circularity,
               area_over_running_max, running_max_abs_d_circularity]
    num_lags: 1

  - name: shape_memory_intensity
    features: [area, circularity,
               area_over_running_max, running_max_abs_d_circularity,
               phase_mean, phase_std, phase_contrast,
               rfp_mean, rfp_cv, rfp_concentration]
    num_lags: 1

# ------------------------------------------------------------------
# Model fitting
# ------------------------------------------------------------------
# absorbing_variants: which constraint settings to fit for every arm x k.
#   true  -> the LAST state (index k-1) has its transition row pinned to
#            one-hot self-transition; no dead -> alive is possible.
#   false -> unconstrained control.
absorbing_variants: [true, false]
num_states_sweep: [2, 3, 4, 5]
em_seeds: [0, 1, 2]
num_em_iters: 100
init_method: kmeans
init_stickiness: 0.9
min_t: 10
standardize_features: true

# ------------------------------------------------------------------
# Input paths
# ------------------------------------------------------------------
type_sep_tracks_dir: /gladstone/engelhardt/lab/jadjasu/LiveCellUmbrella/treeHMM/scripts/cancer_dino_hmm/type_sep_tracks

# Crops aligned with the ground-truth tracks; last axis: 0 = RFP, 1 = phase.
# Verified against the masks: RFP is 3.1x background inside cancer masks and
# 1.4x inside T-cell masks, which is the expected pattern given that only
# cancer cells carry RFP nuclei.
tracking_crops_dir: /gladstone/engelhardt/lab/MarsonLabIncucyteData/TrackingCrops/CarnevaleRepStim

imaging_pipeline_dir: /gladstone/engelhardt/lab/jadjasu/LiveCellUmbrella/MarsonImagingPipeline
treehmm_dir: /gladstone/engelhardt/lab/jadjasu/LiveCellUmbrella/treeHMM
annotations_path: death_annotations.yml

# ------------------------------------------------------------------
# Output
# ------------------------------------------------------------------
output_base_dir: /gladstone/engelhardt/lab/jadjasu/LiveCellUmbrella/treeHMM/analysis/cancer_dead_state_hmm

# Overlay videos: auto | all | explicit list of {arm, k}
video_fits: auto
video_fps: 2
video_figsize: [7, 7]

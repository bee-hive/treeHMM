# Nucleus tracks, five states, with terminating nuclei held five frames.
#
# Self-contained rather than extending a `nuclei_k5.yml`, so it stands up on a
# checkout that does not have one.  Mappings merge key by key, so naming
# `frames` alone leaves `exclusion_px`/`evidence_px` on the inherited 50/30.
#
# Those are ordinary config values -- they used to be derivable from
# dino.patch_px via `auto`, which is gone, and a config still saying `auto` is
# refused by name.  No DINO here, and none is needed: the extension asks only
# for cells.source: nuclei, since its criteria are measured from the nucleus
# centroid.  Expect very few tracks to qualify -- 6 of 224 on the six
# ground-truth crops, adding 30 of 5361 cell-frames.
extends: base_k5.yml

run_name: nuclei_k5_ext5
description: As base_k5 on nucleus tracks, holding terminating nuclei 5 frames.

cells:
  source: nuclei
  extend_nuclei:
    frames: 5

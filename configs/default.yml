# Experiment-facing defaults.
#
# A run config extends this file and overrides only what it does differently.
# Merge rule: mappings merge key by key, but every other type -- INCLUDING LISTS
# -- is replaced wholesale.  So a run writing `model: {features: [area]}` gets
# exactly `[area]`, not this file's list plus `area`.  A value of `null` deletes
# an inherited key.

# config this one layers over, resolved relative to THIS file's directory
extends: site.yml

# directory name under paths.output_root; must be unique across runs
run_name: default                        # ^[A-Za-z0-9_][A-Za-z0-9_.-]*$

# free-text note recorded in the resolved config and the manifest
description: Defaults only; not meant to be run directly.

# which segmentation defines a "cell", and which cells are modelled at all
cells:
  # mask source: CVAT whole-body tracks, or the cancer-nuclei tracks.  Swaps the label
  # space whole -- features, DINO patches, fit and overlays -- so shape features
  # and t_cell_neighbors are not comparable between the two.
  source: phase                          # [phase, nuclei]

  # drop cells observed for fewer than this many frames
  min_frames: 1                         # int > cells.warmup_frames

  # leading frames per cell excluded from inference; held fixed across num_lags
  warmup_frames: 1                       # int >= 1

  # NUCLEI ONLY, and off by default.  A nucleus track that simply stops --
  # possibly a death the tracker could not follow -- while the SAM3 phase track
  # in the same place carries on is held for a few more frames, so the model
  # sees what happens after the nucleus goes.  The mask is copied verbatim:
  # same pixels, same shape, same centroid.  A track is held only when it did
  # not divide, no other nucleus comes within exclusion_px of it, and SAM3 still
  # sees something within evidence_px, in EVERY frame appended -- otherwise it
  # is held for none of them.  Extending moves cells across cells.min_frames,
  # so it changes the cell set and not only the frame set.  DINO is irrelevant
  # to all of it: cells.source: nuclei is the only requirement, because the
  # criteria are measured from the nucleus centroid.
  # See prompts/nuclei-frame-extension.md.
  extend_nuclei:
    # frames appended after a track's final frame; 0 disables the feature, and
    # with 0 nothing below is read or hashed.  Clipped at the end of the movie:
    # a track with 3 frames left is judged over 3 and, if it passes, gains 3.
    frames: 0                            # int >= 0

    # side of the square, centred on the track's last centroid, in which no
    # pixel of any other nucleus may appear in any appended frame.  Widen it to
    # reject more aggressively; narrow it to tolerate closer neighbours.
    exclusion_px: 50                     # int >= 1

    # side of the square in which at least one non-zero SAM3 pixel must appear
    # in every appended frame.  Must not exceed exclusion_px, or the evidence
    # box would reach outside the region the neighbour test cleared.
    evidence_px: 30                      # int >= 1, <= exclusion_px

# per-cell, per-frame track features computed and cached by the `features` step
features:
  # which features to compute; `all` keeps held-out diagnostics for every run
  compute: all                           # 'all' | list of registered feature names

  # tuning constants read by individual features; only those used are hashed
  params:
    # centroid-to-centroid radius for the *_neighbors counts
    neighbor_radius_px: 20               # float > 0, px

    # disk radius used to dilate the mask for dilated_t_cell_neighbors
    dilate_radius_px: 2                  # int >= 0, px

    # trailing window length for the win_std_* features
    window_frames: 5                     # int >= 2, frames

    # whole-stack (never per-frame) intensity scaling; NOT in any cache key, so
    # changing it needs `--force` on features and dino
    norm_percentiles: [1.0, 99.0]        # [low, high], floats on [0.0, 100.0]

# DINOv2 appearance embedding; consulted only when model.use_dino_pcs is true
dino:
  # HuggingFace repo id; embed_dim adapts from the checkpoint's hidden_size
  model_id: facebook/dinov2-base         # facebook/dinov2-{small,base,large,giant}

  # local snapshot dir loaded with local_files_only; not in the cache key
  model_path: /gladstone/engelhardt/home/jadjasu/.cache/huggingface/hub/models--facebook--dinov2-base

  # side lengths of the square patches cut around the rounded centroid,
  # edge-padded; NAMING SEVERAL embeds the cell once per size and averages the
  # embeddings before PCA, giving one multi-scale vector rather than forcing a
  # choice between a close crop and its context
  # one size is the default, and [50] hashes exactly as a bare 50 always did
  patch_px: [50]                         # list of int > 0 (a bare int is fine), px

  # how many principal components of the embedding are fed to the model
  n_pcs: 10                              # int >= 1

  # whiten before PCA; unwhitened, PC1 dwarfs PC10 and kmeans init degenerates
  whiten: true                           # [true, false]

  # forward-pass batch size; throughput only, deliberately not in the cache key
  batch_size: 256                        # int >= 1

  # what is drawn over the greyscale phase patch; at most one overlay
  patch_overlay: none                    # [none, masks, rfp]

  # how much to alpha-blend the cell-type masks over the phase image
  # at 0.0, `patch_overlay: masks` renders plain phase -- raise this too
  mask_alpha: 0.0                        # float on [0.0, 1.0]

  # mask colour for the cell being embedded
  subject_colour: [1.0, 0.0, 0.0]        # [r, g, b], floats on [0.0, 1.0]

  # mask colour for other cancer cells falling inside the patch
  other_cancer_colour: [0.0, 0.0, 1.0]   # [r, g, b], floats on [0.0, 1.0]

  # mask colour for T cells falling inside the patch
  tcell_colour: [0.0, 1.0, 0.0]          # [r, g, b], floats on [0.0, 1.0]

  # strength of the red RFP overlay under `patch_overlay: rfp`
  rfp_alpha: 0.3                         # float on [0.0, 1.0]

# the AR-HMM itself
model:
  # ORDERED; this list then the DINO PCs is the emission vector, and features[0]
  # is what states are sorted by
  features: [area, circularity, velocity, t_cell_neighbors]   # registered feature names

  # append the dino.n_pcs principal components to the emission vector
  use_dino_pcs: false                    # [true, false]

  # number of latent discrete states
  num_states: 5                          # int >= 2

  # autoregressive order: 0 is a plain Gaussian HMM (bias only)
  num_lags: 1                            # [0, 1]

  # z-score each emission dimension over ACTIVE cell-frames only
  standardize: true                      # [true, false]

  # how the initial parameters are drawn before EM
  init_method: kmeans                    # [kmeans, prior, random]

  # diagonal mass of the initial transition and division-transition matrices
  init_stickiness: 0.9                   # float on [0.0, 1.0]

  # number of EM iterations per seed; there is no convergence-based early stop
  num_em_iters: 50                       # int >= 1

  # the only randomness surface: EM runs once per seed, best final log prob wins
  em_seeds: [0, 1, 2]                    # non-empty list of distinct ints

# figures, tables and videos written under analysis/runs/<run_name>/outputs/
outputs:
  # state-tinted overlay movies, one per crop
  video:
    # which crops to render
    crops: all                           # 'all' | 'none' | ids from data.crop_ids

    # playback rate of the written mp4
    fps: 2                               # int >= 1

    # matplotlib figure size
    figsize: [7, 7]                      # [width, height], inches

    # render resolution; figsize x dpi must stay constant across frames
    dpi: 160                             # int >= 1

    # draw each cell's track id at its mask centroid
    label_cell_ids: true                 # [true, false]

  # per-state distribution of every cached feature, plus the summary csv
  feature_distributions:
    # plot style; anything other than `violin` falls back to a boxplot
    kind: violin                         # [violin, box]

    # maximum number of panels per row
    max_cols: 4                          # int >= 1

    # currently unused: the figure always plots every cached feature
    include: all                         # inert; kept so the outputs key is stable

  # inferred cell-frames per state, binned by how long the cell has existed,
  # pooled over every crop
  state_age_histogram:
    # width of one age bin, in frames
    bin_frames: 1                        # int >= 1

    # largest age plotted; older cell-frames are dropped and reported, never
    # folded into the last bin
    max_age: auto                        # 'auto' | int >= 1

    # bar style; `stacked` shows the total, `grouped` compares states directly
    kind: stacked                        # [stacked, grouped, step]

    # what age 0 means.  `existence` is the cell's first observed frame; the
    # plot then starts at cells.warmup_frames, since the model is given no state
    # below that age.  `inferred` starts the clock at the first frame a state
    # exists for, so every cell contributes to age 0 by construction.
    anchor: existence                    # [existence, inferred]

  # opt-in extra outputs, discovered by filename under arhmm/extras/
  extras: []                             # [condition_stats, dino_confounds, state_timeline]

  # a DINO run also gets dino_step_distance whether or not `extras` names it:
  # whether the embedding tracks the cell or the per-frame noise is not an
  # optional question about a DINO run.  Set false to run only what is named.
  auto_dino_extras: true                 # [true, false]

  # settings for the dino_step_distance extra; like every extra's settings these
  # are NOT in any cache key, so changing one needs `--force` on extras
  dino_step_distance:
    # how two embeddings are compared; cosine ignores vector magnitude, which
    # matters here because averaging over patch sizes shrinks the norms
    metric: cosine                       # [cosine, euclidean]
